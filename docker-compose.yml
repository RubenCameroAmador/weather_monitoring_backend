services:
  db:
    image: postgres:15
    container_name: weather_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: weather_data
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: weather_api
    restart: always

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env.docker

    volumes:
      - .:/app

  mcp:
    build: .
    container_name: weather_mcp
    command: python -m app.mcp.server streamable-http
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker

  nginx:
    image: nginx:alpine
    container_name: weather_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - mcp

volumes:
  postgres_data: